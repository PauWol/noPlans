<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta name="theme-color" content="#7c3aed" />
		<!-- Apple Touch Icons -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">

		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
